name: CI Workflow and Dockerize

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn imbalanced-learn matplotlib seaborn

      - name: Train Model via MLProject
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Save Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifacts
          path: MLProject/mlruns/

      - name: Build Docker Image
        run: |
          cd MLProject
          export MLFLOW_TRACKING_URI="file:$(pwd)/mlruns"
          
          RUN_ID=$(cat run_id.txt)
          
          # Trik Fix Bug Pip "Sapu Bersih"
          # Mencari SEMUA file requirements.txt di folder mlruns dan menghapus tulisan python=
          find mlruns -name "requirements.txt" -type f -exec sed -i '/python=/d' {} +
          
          # Mencegah error serupa pada file conda.yaml internal milik model
          find mlruns -name "conda.yaml" -type f -exec sed -i '/- python=/d' {} +
          
          # Membangun Docker Image
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n ${{ secrets.DOCKER_USERNAME }}/beasiswa-model:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/beasiswa-model:latest